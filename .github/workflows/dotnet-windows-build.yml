name: _dotnet-windows-build

on:
  workflow_call:
    inputs:
      # *** ENV / TOOLING ***
      project-or-solution:
        description: Path to .sln/.csproj
        type: string
        required: true
      dotnet-version:
        description: .NET SDK (e.g., 7.0.x or 8.0.x)
        type: string
        default: '8.0.x'
      # Only when a repo has net461 targets or props that need it
      install-framework-461:
        description: Install .NET Framework 4.6.1 targeting pack
        type: boolean
        default: false
      configuration:
        description: Build configuration
        type: string
        default: 'Release'
      runtime:
        description: Restore/Publish RID (e.g., win-x86, win-x64)
        type: string
        default: 'win-x86'
      use-nuget-restore:
        description: Run nuget restore for packages.config projects
        type: boolean
        default: false
      # Switch to full MSBuild (good for mixed/legacy solutions)
      build-with-msbuild:
        description: Use Visual Studio MSBuild instead of dotnet build
        type: boolean
        default: false    

      # === VERSIONING ===
      versioning-mode:
        description: auto_tags | none
        type: string
        default: 'auto_tags'

      # Auto-tags (only if versioning-mode=auto_tags)
      develop-prefix:
        description: Prefix for develop tags
        type: string
        default: 'develop-v'
      main-prefix:
        description: Prefix for main branch tags (beta channel)
        type: string
        default: 'main-v'
      release-prefix-template:
        description: Prefix for release/* tags. Use {base} for branch base (e.g., 3.0.0)
        type: string
        default: 'release-{base}-v'
      default-develop-version:
        description: First develop version if no tags exist
        type: string
        default: '1.0.0.0'
      default-release-revision:
        description: Suffix for first release tag (e.g., '.0' -> 3.0.0.0)
        type: string
        default: '.0'
      project-tag-suffix:
        description: Optional per-project suffix added to tag prefix (e.g., '-WS' -> develop-v...-WS)
        type: string
        default: ''        
        
      # *** TEST ***
      test-project-or-solution:
        description: Optional test project/solution path filter
        type: string
        default: ''
      run-tests:
        type: boolean
        default: false
        
      # *** PUBLISH APP (dotnet publish) ***
      publish-profile:
        description: PublishProfile name (FolderProfile, etc.)
        type: string
        default: ''
      publish-output-dir:
        description: >
          Output directory for `dotnet publish` (-o), relative to the workspace. An alternative to
          publish-profile for the case an installer harvests: publish to a known directory, sign
          what is in it, then hand that directory to the .wixproj as wix-publish-dir. Unlike
          publish-profile this does not upload the publish output as its own artifact - it is
          build input for the MSI, not something to ship twice.
        type: string
        default: ''
      publish-self-contained:
        description: Publish self-contained (--self-contained) against the chosen runtime
        type: boolean
        default: false

      # === MSI (WiX) ===
      wix-project:
        description: Path to .wixproj
        type: string
        default: ''
      wix-platform:
        description: x86 | x64
        type: string
        default: 'x86'
      wix-version:
        description: WiX Toolset 3.x version to install (e.g., 3.11.2). Ignored when wix-toolset-major is 6.
        type: string
        default: '3.11.2'
      wix-toolset-major:
        description: >
          WiX major version. '3' installs the toolset via chocolatey and builds the .wixproj with
          MSBuild (the fleet default). '6' needs no toolset install at all - a WiX 6 .wixproj is
          SDK-style and builds with plain `dotnet build`, restoring the compiler as a NuGet
          package - so none of the WiX 3 path resolution below applies to it.
        type: string
        default: '3'
      wix-publish-dir:
        description: >
          WiX 6 only. PublishDir handed to the .wixproj, i.e. the directory it harvests. Defaults
          to publish-output-dir, which is almost always the same directory - set it only when the
          installer harvests somewhere other than where the app was published to. If neither is
          set, the .wixproj is left to its own default.
        type: string
        default: ''

      # === CODE SIGNING (SSL.com eSigner) ===
      #
      # Off by default: a repo opts in with sign: true and supplies the four ES_* secrets.
      #
      # Order matters more than anything else here. The application executable is signed BEFORE
      # the MSI is built, because the .wixproj packages whatever is sitting in the publish
      # directory - sign afterwards and you ship a signed installer carrying an unsigned binary,
      # which passes every check anyone thinks to run on the MSI and fails the one that matters
      # on the target machine. The verify step exists to make that mistake impossible to miss.
      sign:
        description: Sign the application executable and the MSI with SSL.com eSigner
        type: boolean
        default: false
      sign-file:
        description: >
          Executable to sign before the MSI is built. One file: the fleet's installers each ship a
          single owned executable. Extending to several means switching to eSigner batch signing,
          which is a different command and not wired up here.
        type: string
        default: ''
      esigner-environment:
        description: >
          'PROD' for the real certificate, 'TEST' for SSL.com's public sandbox. TEST produces a
          structurally real signature that chains to an untrusted test CA, so it proves the
          pipeline and proves nothing about publisher trust - builds signed that way are labelled
          -DEMO-SIGNED and are not gated on chain trust.
        type: string
        default: 'PROD'
      application-name:
        description: Prefix used for artifact naming (e.g., 'SysnetOrderService', 'SCIS', etc.)
        type: string
        default: ${{ github.event.repository.name }}

    outputs:
      version:
        description: Resolved version (may be empty if versioning-mode=none on non-matching branches)
        value: ${{ jobs.build.outputs.version }}
      artifact_name:
        description: Name of published app artifact (if produced)
        value: ${{ jobs.build.outputs.artifact_name }}

    secrets:
      GH_PACKAGES_TOKEN:
        description: Optional PAT for cross-repo GitHub Packages restore (fallback to GITHUB_TOKEN)
        required: false

      # Declared individually and passed individually by each caller. Deliberately NOT relying on
      # `secrets: inherit` - these four together are the whole signing credential, and inherit
      # would hand every secret a calling repo holds to this workflow whether or not it signs.
      # Marked required: false so non-signing callers need not supply them; the guard step below
      # fails fast, by name, when sign is true and one is missing.
      ES_USERNAME:
        description: SSL.com eSigner account username (required when sign=true)
        required: false
      ES_PASSWORD:
        description: SSL.com eSigner account password (required when sign=true)
        required: false
      ES_CREDENTIAL_ID:
        description: SSL.com eSigner signing credential id (required when sign=true)
        required: false
      ES_TOTP_SECRET:
        description: SSL.com eSigner TOTP secret for automated signing (required when sign=true)
        required: false

jobs:
  build:
    permissions:
      contents: write   # needed for pushing tags (auto_tags)
      packages: read
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      artifact_name: ${{ steps.artifact-meta.outputs.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # *** ENV / TOOLING ***

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs['dotnet-version'] }}

      # Fails before anything is built, and names the missing secret. Without this, a caller that
      # sets sign: true but forgets to pass a secret gets an empty credential handed to the
      # signing action, which reports its own failure far later and far less clearly - after a
      # full publish, on a step whose error text is about CodeSignTool rather than about
      # configuration.
      - name: Check signing configuration
        if: ${{ inputs.sign }}
        shell: pwsh
        # Through env, not interpolated into the script body: an expression is substituted into
        # the rendered command before the shell ever runs, so the credential would sit in the
        # script text itself. As environment variables they are only ever read by name.
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $missing = @()
          if (-not $env:ES_USERNAME)      { $missing += 'ES_USERNAME' }
          if (-not $env:ES_PASSWORD)      { $missing += 'ES_PASSWORD' }
          if (-not $env:ES_CREDENTIAL_ID) { $missing += 'ES_CREDENTIAL_ID' }
          if (-not $env:ES_TOTP_SECRET)   { $missing += 'ES_TOTP_SECRET' }
          if ($missing.Count -gt 0) {
            throw ("sign: true but these secrets were not passed by the caller: {0}. Pass each one explicitly under `secrets:` in the calling workflow." -f ($missing -join ', '))
          }
          if (-not "${{ inputs['sign-file'] }}" -and -not "${{ inputs['wix-project'] }}") {
            throw "sign: true but there is nothing to sign - set sign-file, wix-project, or both."
          }
          # sign-file is not optional once an MSI is in play. Verify extracts the MSI and requires
          # the application binary inside it to be signed, so without sign-file the run builds an
          # MSI from an unsigned publish, signs the MSI, and only then fails - after the signing,
          # on an error about the binary rather than about configuration. Fail here in two seconds
          # instead.
          if ("${{ inputs['wix-project'] }}" -and -not "${{ inputs['sign-file'] }}") {
            throw "sign: true with wix-project set also needs sign-file - the MSI's own signature is not evidence that the executable inside it is signed, and that is what gets verified."
          }
          Write-Host "Signing enabled, environment: ${{ inputs['esigner-environment'] }}"

      - name: Ensure WiX Toolset version
        if: ${{ inputs['wix-project'] != '' && inputs['wix-version'] != '' && inputs['wix-toolset-major'] == '3' }}
        shell: pwsh
        run: |
          $desired = "${{ inputs['wix-version'] }}"
          $pkg = choco list --local-only wixtoolset --limit-output | ForEach-Object {
            ($_ -split '\|')[1]
          }
          if ($pkg -eq $desired) {
            Write-Host "WiX $desired already installed, skipping."
            exit 0
          }
          if ($pkg) {
            Write-Host "Different WiX version ($pkg) detected. Uninstalling..."
            choco uninstall wixtoolset -y --no-progress
          }
          Write-Host "Installing WiX $desired..."
          choco install wixtoolset --version $desired -y --no-progress
        
      # Install .NET Framework 4.6.1 targeting pack if requested
      - name: Install .NET Framework 4.6.1 targeting pack
        if: ${{ inputs.install-framework-461 }}
        shell: powershell
        run: choco install netfx-4.6.1-devpack -y

      - name: Setup GitHub Packages source
        shell: pwsh
        run: |
          $configContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
          <packageSources>
            <clear />
            <add key="github" value="https://nuget.pkg.github.com/HnLAustralia/index.json" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <github>
              <add key="Username" value="${{ github.repository_owner }}" />
              <add key="ClearTextPassword" value="$env:NUGET_AUTH_TOKEN" />
            </github>
          </packageSourceCredentials>
          </configuration>
          "@
          Set-Content -Path "NuGet.config" -Value $configContent

      # Optional: NuGet restore for packages.config
      - name: NuGet restore (packages.config)
        if: ${{ inputs['use-nuget-restore'] }}
        run: nuget restore "${{ inputs['project-or-solution'] }}" -NonInteractive

      # SDK restore with RID
      - name: Restore
        run: dotnet restore "${{ inputs['project-or-solution'] }}" -r "${{ inputs.runtime }}" /p:WixTargetsImported=true
        
      # ================= Versioning =================
      - name: Compute & Push Tag (Auto Tags)
        id: autotags
        if: ${{ inputs['versioning-mode'] == 'auto_tags' }}
        shell: pwsh
        env:
          DEVELOP_PREFIX: ${{ inputs['develop-prefix'] }}
          MAIN_PREFIX: ${{ inputs['main-prefix'] }}
          RELEASE_PREFIX_TEMPLATE: ${{ inputs['release-prefix-template'] }}
          DEFAULT_DEV_VERSION: ${{ inputs['default-develop-version'] }}
          DEFAULT_RELEASE_REV: ${{ inputs['default-release-revision'] }}
          SUFFIX: ${{ inputs['project-tag-suffix'] }}
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git fetch --tags

          $branch = "${{ github.ref_name }}"

          $next = $null
          $tagPrefixForNewTag = $null
          $baseText = $null
          $baseVersion = $null

          # --- Determine target base and what prefix to use for the *new* tag ---

          if ($branch -eq "develop") {
            # Example: DEFAULT_DEV_VERSION='9.1.0.0'
            $baseVersion = [version]$env:DEFAULT_DEV_VERSION
            $baseText = "{0}.{1}.{2}" -f $baseVersion.Major, $baseVersion.Minor, $baseVersion.Build
            $tagPrefixForNewTag = "$env:DEVELOP_PREFIX$env:SUFFIX"
          }
          elseif ($branch -eq "main") {
            # main uses the same base version line as develop (shares the revision sequence)
            $baseVersion = [version]$env:DEFAULT_DEV_VERSION
            $baseText = "{0}.{1}.{2}" -f $baseVersion.Major, $baseVersion.Minor, $baseVersion.Build
            $tagPrefixForNewTag = "$env:MAIN_PREFIX$env:SUFFIX"
          }
          elseif ($branch -like "release/*") {
            # Example branch: release/9.1.0  -> baseText='9.1.0'
            $baseText = $branch -replace '^release/', ''
            # Use DEFAULT_RELEASE_REV just to construct a full version so we can get Major/Minor/Build
            $baseVersion = [version]("$baseText$env:DEFAULT_RELEASE_REV")
            $tagPrefixForNewTag = ($env:RELEASE_PREFIX_TEMPLATE -replace '\{base\}', $baseText) + $env:SUFFIX
          }
          else {
            Write-Host "Non-develop, non-main, non-release branch. Skipping versioning."
            "version=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          # --- Collect existing tags for this base across BOTH dev + release prefixes ---

          $developPrefixForSearch = "$env:DEVELOP_PREFIX$env:SUFFIX"
          $mainPrefixForSearch = "$env:MAIN_PREFIX$env:SUFFIX"
          $releasePrefixForSearch = ($env:RELEASE_PREFIX_TEMPLATE -replace '\{base\}', $baseText) + $env:SUFFIX

          $candidates = @()

          foreach ($p in @($developPrefixForSearch, $mainPrefixForSearch, $releasePrefixForSearch)) {
            if (-not $p) { continue }

            git tag --list "$p*" | ForEach-Object {
              $name = $_
              $numeric = $name.Substring($p.Length)
              try {
                $v = [version]$numeric
              }
              catch {
                return
              }

              if ($v.Major -eq $baseVersion.Major -and
                  $v.Minor -eq $baseVersion.Minor -and
                  $v.Build -eq $baseVersion.Build) {
                $candidates += $v
              }
            }
          }

          # --- Decide next version ---

          if ($candidates.Count -gt 0) {
            $latest = ($candidates | Sort-Object -Descending | Select-Object -First 1)
            $next = "{0}.{1}.{2}.{3}" -f $latest.Major, $latest.Minor, $latest.Build, ($latest.Revision + 1)
          }
          else {
            if ($branch -eq "develop") {
              # First ever build for this base across ALL branches
              $next = $env:DEFAULT_DEV_VERSION
            }
            else {
              # First build on this release line, and no dev/release tags exist for this base
              $next = "$baseText$env:DEFAULT_RELEASE_REV"
            }
          }

          # --- Tag and output ---

          $newTag = "$tagPrefixForNewTag$next"
          Write-Host "Tagging: $newTag"
          git tag $newTag
          git push origin $newTag

          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Select Version Output
        id: set-version
        shell: pwsh
        run: |
          $auto   = '${{ steps.autotags.outputs.version }}'
          $v = if ($auto) { $auto } else { '' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      - name: Detect build channel
        id: channel
        shell: pwsh
        run: |
          $branch = '${{ github.ref_name }}'
          if ($branch -eq 'develop') {
            "value=alpha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          elseif ($branch -eq 'main') {
            "value=beta" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          elseif ($branch -like 'release/*') {
            "value=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            "value=other" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # ================= Build & Test =================
      - name: Build (MSBuild)
        if: ${{ inputs['build-with-msbuild'] || inputs['wix-project'] == '' }}
        shell: cmd
        run: |
          MSBuild.exe ^
            "${{ inputs['project-or-solution'] }}" /m ^
            /p:Configuration=${{ inputs.configuration }} ^
            /p:Platform=${{ inputs['wix-platform'] }} ^
            /p:Version=${{ steps.set-version.outputs.version }} ^
            /p:BuildChannel=${{ steps.channel.outputs.value }} ^
            /v:m

      - name: Build
        if: ${{ !inputs['build-with-msbuild'] && inputs['wix-project'] != '' && inputs['publish-profile'] == '' }}
        run: dotnet build "${{ inputs['project-or-solution'] }}" -c "${{ inputs.configuration }}" -r "${{ inputs.runtime }}" --no-restore

      - name: Test
        if: ${{ inputs['run-tests'] }}
        run: |
          if ("${{ inputs['test-project-or-solution'] }}") {
            dotnet test "${{ inputs['test-project-or-solution'] }}" -c "${{ inputs.configuration }}" --no-build --collect:"XPlat Code Coverage" /p:WixTargetsImported=true
          } else {
            dotnet test "${{ inputs['project-or-solution'] }}" -c "${{ inputs.configuration }}" --no-build --collect:"XPlat Code Coverage" /p:WixTargetsImported=true
          }

      # ================= Publish (optional) =================
      - name: Publish
        if: ${{ inputs['publish-profile'] != '' || inputs['publish-output-dir'] != '' }}
        shell: pwsh
        run: |
          $version = '${{ steps.set-version.outputs.version }}'
          $profile = '${{ inputs['publish-profile'] }}'
          $outDir  = '${{ inputs['publish-output-dir'] }}'
          $channel = '${{ steps.channel.outputs.value }}'
          $args = @(
            'publish', '${{ inputs['project-or-solution'] }}',
            '-c', '${{ inputs.configuration }}'
          )
          if ($profile) { $args += "/p:PublishProfile=$profile" }
          if ($outDir) {
            # Runtime and self-contained are explicit here rather than left to the project, so the
            # same csproj can be published framework-dependent by one caller and self-contained by
            # another without editing it.
            $args += @('-r', '${{ inputs.runtime }}', '-o', $outDir)
            # Value as a separate argument: the dotnet CLI takes `--self-contained true`, not the
            # MSBuild-style `--self-contained:true`, which it rejects.
            $args += @('--self-contained', '${{ inputs['publish-self-contained'] }}'.ToLower())
          }
          if ($version) { $args += "/p:Version=$version" }
          if ($channel) { $args += "/p:BuildChannel=$channel" }
          Write-Host "dotnet $args"
          dotnet @args /p:WixTargetsImported=true

      # ================= WiX (optional) =================
      # ================= Code signing: the executable, before the MSI =================
      #
      # PINNED TO A COMMIT, not to @develop as SSL.com's own documentation shows. This action is
      # handed the whole signing credential, so a branch reference means the code that receives
      # it can change without anyone in this org reviewing it. The SHA is what @develop resolved
      # to when it was pinned. Worth knowing for whoever updates it: upstream tags releases but
      # does not merge them back, so develop sits behind the v1.3.2 tag (cf5f6c1, 2025-12-22) -
      # moving to the tag is an upgrade to verify, not a rename.
      - name: Sign application executable
        if: ${{ inputs.sign && inputs['sign-file'] != '' }}
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747  # develop @ 2025-06-23
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          environment_name: ${{ inputs['esigner-environment'] }}
          file_path: ${{ github.workspace }}\${{ inputs['sign-file'] }}
          override: true

      - name: Resolve WiX paths
        id: wixpaths
        if: ${{ inputs['wix-project'] != '' && inputs['wix-toolset-major'] == '3' }}
        shell: pwsh
        run: |
          # Verify what the .wixproj thinks WixTargetsPath is
          $msbuild = (Get-Command MSBuild.exe -ErrorAction Stop).Path
          $wixProj = "${{ inputs['wix-project'] }}"
          $wixTargetsPath = & $msbuild $wixProj /nologo -getProperty:WixTargetsPath | Select-Object -Last 1

          if (-not $wixTargetsPath -or -not $wixTargetsPath.Trim()) {
            throw "WixTargetsPath property is empty. Check your .wixproj configuration."
          }

          if (!(Test-Path $wixTargetsPath)) {
            throw "WiX targets not found at '$wixTargetsPath' (from WixTargetsPath in $wixProj)."
          }

          # Find WiX Toolset bin folder (where WixTasks.dll actually lives)
          $ver = "${{ inputs['wix-version'] }}"
          $programFilesX86 = ${env:ProgramFiles(x86)}

          $all = Get-ChildItem $programFilesX86 -Directory |
                Where-Object { $_.Name -like 'WiX Toolset v3.*' } |
                Sort-Object Name -Descending

          $candidate = $null
          if ($ver -and $ver.Trim()) {
            try {
              $v = [version]$ver
              $short = "$($v.Major).$($v.Minor)"   # e.g. 3.11
              $candidate = $all | Where-Object { $_.Name -eq "WiX Toolset v$short" } | Select-Object -First 1
            } catch { }
          }

          if (-not $candidate) { $candidate = $all | Select-Object -First 1 }
          if (-not $candidate) { throw "No WiX Toolset v3.x installation found under $programFilesX86" }

          $wixBin = Join-Path $candidate.FullName 'bin'
          $wixTasks = Join-Path $wixBin 'WixTasks.dll'
          if (!(Test-Path $wixTasks)) {
            throw "WiX tasks not found at '$wixTasks'. Check WiX installation."
          }

          "WIX_BIN=$wixBin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI (WiX)
        if: ${{ inputs['wix-project'] != '' && inputs['wix-toolset-major'] == '3' }}
        shell: cmd
        run: |
          MSBuild.exe ^
            "${{ inputs['wix-project'] }}" ^
            /p:Configuration=${{ inputs.configuration }} ^
            /p:Platform=${{ inputs['wix-platform'] }} ^
            /p:ProductVersion=${{ steps.set-version.outputs.version }} ^
            /p:BuildProjectReferences=false ^
            /p:BuildChannel=${{ steps.channel.outputs.value }} ^
            /p:WixToolPath="${{ steps.wixpaths.outputs.WIX_BIN }}\\" ^
            /p:WixTasksPath="${{ steps.wixpaths.outputs.WIX_BIN }}\\WixTasks.dll" ^
            /nr:false ^
            /t:Rebuild /v:m

      # A WiX 6 .wixproj is SDK-style: the compiler arrives as a NuGet package on restore, so
      # there is no toolset to install, no WixToolPath to resolve, and no MSBuild.exe needed.
      # Version flows in as Version rather than ProductVersion, matching the SDK-style property
      # the .wixproj binds its Package/@Version to.
      - name: Build MSI (WiX 6)
        if: ${{ inputs['wix-project'] != '' && inputs['wix-toolset-major'] == '6' }}
        shell: pwsh
        run: |
          $buildArgs = @(
            'build', '${{ inputs['wix-project'] }}',
            '-c', '${{ inputs.configuration }}',
            # Same reason the WiX 3 path sets it: the application has already been published and
            # signed by this point, and a .wixproj that project-references it would rebuild it
            # here - harvesting something other than what was signed.
            '-p:BuildProjectReferences=false',
            # Platform drives InstallerPlatform in the WiX SDK unless the .wixproj pins it
            # (verified: a bare WiX 6 project defaults to x86 and follows -p:Platform=x64). The
            # WiX 3 path forwards wix-platform; without this the WiX 6 path would quietly ignore
            # a caller asking for x64 and ship an installer for the wrong architecture.
            '-p:Platform=${{ inputs['wix-platform'] }}'
          )
          $version = '${{ steps.set-version.outputs.version }}'
          if ($version) { $buildArgs += "-p:Version=$version" }
          $channel = '${{ steps.channel.outputs.value }}'
          if ($channel) { $buildArgs += "-p:BuildChannel=$channel" }
          # Falls back to publish-output-dir rather than silently letting the .wixproj use its own
          # default: publishing and signing one directory while the installer harvests another is
          # a wrong payload with no error anywhere, which is the worst shape a bug can take here.
          $publishDir = '${{ inputs['wix-publish-dir'] }}'
          if (-not $publishDir) { $publishDir = '${{ inputs['publish-output-dir'] }}' }
          if ($publishDir) {
            # Absolute: the .wixproj resolves PublishDir relative to itself, not to the workspace,
            # so a relative value silently harvests nothing and yields an MSI missing its payload.
            $buildArgs += "-p:PublishDir=$(Join-Path '${{ github.workspace }}' $publishDir)"
          }
          Write-Host "dotnet $buildArgs"
          dotnet @buildArgs

      # ================= Code signing: the MSI =================
      - name: Locate the built MSI
        id: msi
        if: ${{ inputs.sign && inputs['wix-project'] != '' }}
        shell: pwsh
        run: |
          # Resolved rather than hardcoded: the leaf name carries the build channel in some
          # repos, so a channel rename must not quietly leave the MSI unsigned while this step
          # still reports success. Exactly one is expected - more than one means the glob is
          # picking up a stale build and signing the wrong file is worse than failing here.
          $found = @(Get-ChildItem -Path "${{ github.workspace }}" -Filter *.msi -Recurse |
            Where-Object { $_.FullName -notlike "*_msi_staging*" })
          if ($found.Count -ne 1) {
            throw "Expected exactly one MSI, found $($found.Count): $($found.FullName -join ', ')"
          }
          "path=$($found[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSI: $($found[0].FullName)"

      - name: Sign MSI
        if: ${{ inputs.sign && inputs['wix-project'] != '' }}
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747  # develop @ 2025-06-23
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          environment_name: ${{ inputs['esigner-environment'] }}
          file_path: ${{ steps.msi.outputs.path }}
          override: true

      # Taken from this repo rather than the caller's, so every signing repo gets the same check
      # and a fix reaches all of them at once.
      #
      # Pinned to job_workflow_sha: the exact commit of the reusable workflow currently running,
      # so the script is always the one that shipped with it. This was a caller-supplied ref
      # defaulting to a tag, which was wrong twice over - tags are mutable, so the code executed
      # here could be changed under every caller without touching this file, and a caller could
      # point it anywhere. That is the same argument used two steps up for pinning the eSigner
      # action to a SHA rather than @develop, and it applies just as much to a script this job
      # executes while holding the package token.
      #
      # persist-credentials: false because nothing here needs to authenticate - this repo is
      # public - and the default would otherwise leave a token in .shared-ci/.git/config.
      - name: Check out shared signing scripts
        if: ${{ inputs.sign && inputs['wix-project'] != '' }}
        uses: actions/checkout@v4
        with:
          repository: HnLAustralia/.github
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          fetch-depth: 1
          persist-credentials: false

      # Runs BEFORE the upload, so nothing unsigned is ever published. The check that earns its
      # place is the executable INSIDE the MSI: both signing steps report success even when the
      # MSI build has overwritten the signed executable with a freshly published one.
      #
      # Chain trust is gated only on PROD. A sandbox signature reaches no trusted root, so
      # demanding it there would be a permanently red build; demanding it on PROD is what stops a
      # silent downgrade back to a demo certificate, which the issuer check cannot catch because
      # SSL Corp issues both.
      - name: Verify signatures
        if: ${{ inputs.sign && inputs['wix-project'] != '' }}
        shell: pwsh
        run: |
          # ExecutableName is what the script looks for inside the MSI. It comes from sign-file
          # rather than being assumed, so this works for any repo's installer - the guard above
          # has already established sign-file is set whenever an MSI is being signed.
          $signFile = '${{ inputs['sign-file'] }}'
          $verifyArgs = @{
            MsiPath        = '${{ steps.msi.outputs.path }}'
            PublishExe     = Join-Path '${{ github.workspace }}' $signFile
            ExecutableName = Split-Path -Leaf $signFile
          }
          if ('${{ inputs['esigner-environment'] }}' -eq 'PROD') { $verifyArgs.ExpectTrusted = $true }
          & "${{ github.workspace }}/.shared-ci/scripts/verify-signatures.ps1" @verifyArgs

      # ================= Artifacts =================
      - name: Artifact metadata
        id: artifact-meta
        shell: pwsh
        run: |
          $v = '${{ steps.set-version.outputs.version }}'
          $app = '${{ inputs.application-name }}'
          $channel = '${{ steps.channel.outputs.value }}'

          # Defensive: keep artifact names filesystem-friendly
          $app = ($app -replace '[^A-Za-z0-9._-]', '-')  # spaces -> '-', etc.
          $app = $app.Trim('-')
              
          $base = if ($v) { "build-$v" } else { "build" }
          if ($channel) { $base = "$base-$channel" }
          $name = "${app}_$base"

          # Labels a demo-signed build on the artifact someone is about to download, rather than
          # only in a log nobody opens once it is green. It also corrects itself: flipping
          # esigner-environment adds or removes the suffix with nothing here to remember.
          #
          # Computed in PowerShell on purpose. The Actions-expression spelling of this
          # (`cond && '' || '-DEMO-SIGNED'`) reads naturally and is always wrong - an empty string
          # is falsy, so the true branch collapses into the false one and every build gets
          # labelled DEMO-SIGNED.
          if ('${{ inputs.sign }}' -eq 'true' -and '${{ inputs['esigner-environment'] }}' -ne 'PROD') {
            $name = "$name-DEMO-SIGNED"
          }

          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Artifact name: $name"

      - name: Upload Publish Output (if any)
        if: ${{ inputs['publish-profile'] != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}-publish
          if-no-files-found: ignore
          path: |
            **/publish/**
            **/bin/**/publish/**

      - name: Stage MSI files (flatten)
        if: ${{ inputs['wix-project'] != '' }}
        shell: pwsh
        run: |
          New-Item -Path "${{ github.workspace }}/_msi_staging" -ItemType Directory -Force | Out-Null
          Get-ChildItem -Path "${{ github.workspace }}" -Filter *.msi -Recurse |
            Where-Object { $_.FullName -notlike "*_msi_staging*" } |
            ForEach-Object { Copy-Item $_.FullName -Destination "${{ github.workspace }}/_msi_staging/$($_.Name)" -Force }

      - name: Upload MSI (if any)
        if: ${{ inputs['wix-project'] != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}-msi
          if-no-files-found: ignore
          path: ${{ github.workspace }}/_msi_staging/
